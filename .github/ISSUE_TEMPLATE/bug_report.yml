name: Chyba
description: Chyba a postup, jak ji zopakovat
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Neuváděj hesla, tokeny ani osobní údaje. Přidej minimální vstup IFJ26 a očekávaný návratový kód.'
  - type: input
    id: version
    attributes:
      label: Commit
      placeholder: SHA commitu
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Prostředí
      options:
        - Linux
        - Windows
        - macOS
        - Vývojový Docker
        - Jiné — upřesním v popisu
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Jak chybu zopakovat
      description: Kroky, příkazy a vstupy. Co přesně jsi udělal/a?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Co se mělo stát
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Co se stalo
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log bez hesel a tokenů
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Kontrola před odesláním
      options:
        - label: Stejné issue tu ještě není.
          required: true
        - label: Popis obsahuje postup a neobsahuje citlivé údaje.
          required: true
